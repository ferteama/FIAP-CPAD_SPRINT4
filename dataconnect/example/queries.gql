mutation CreateProject($data: Project_Data!) @auth(level: USER) {
  project_insert(data: $data)
}

mutation UpdateProject($id: UUID!, $data: Project_Data!) @auth(level: USER) {
  project_update(id: $id, data: $data)
}

mutation DeleteProject($id: UUID!) @auth(level: USER) {
  project_delete(id: $id)
}

query GetProject($id: UUID!) @auth(level: PUBLIC, insecureReason: "Projects are public records.") {
  project(id: $id) {
    name
    locationCoordinates
    description
    startDate
  }
}

query ListProjects @auth(level: PUBLIC, insecureReason: "Projects are public records.") {
  projects {
    id
    name
    locationCoordinates
  }
}

